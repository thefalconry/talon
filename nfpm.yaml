# nfpm packaging manifest for the standalone Talon binary (.deb and .rpm).
# Built per-arch in the `deb` job of publish.yml; VERSION / ARCH are
# supplied via the environment (nfpm expands ${VAR} in top-level scalar
# fields like `arch`/`version` natively). NOTE: nfpm does NOT expand
# ${VAR} inside `contents[].src` — that field is a literal glob pattern,
# not a templated string. So the workflow copies each arch's binary to
# the fixed path below (dist/talon-bin) before invoking nfpm, rather than
# templating `src` per-arch.
#
# Talon is a self-contained `bun build --compile` binary — no Node runtime
# dependency — so there are no `depends` for either format. Backends
# (claude, codex, …) are still expected on PATH at runtime, same as the npm
# install.
name: talon
arch: ${ARCH}
version: ${VERSION}
section: utils
priority: optional
maintainer: The Falconry <noreply@github.com>
description: |
  Multi-frontend AI agent with full tool access, streaming, cron jobs, and plugins.
  Self-contained standalone binary (no Node.js runtime required).
vendor: The Falconry
homepage: https://github.com/thefalconry/talon
license: MIT
contents:
  - src: dist/talon-bin
    dst: /usr/bin/talon
    file_info:
      mode: 0755
