version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Supply-chain cooldown: a freshly published version is where a
    # hijacked maintainer account shows up, and it is usually yanked within
    # days. Wait before proposing anything (production and dev alike —
    # dev tooling runs in CI next to the release secrets).
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    open-pull-requests-limit: 10
    ignore:
      # 0.3.198–0.3.200 ship a broken sdk.d.ts: SDKMessage references
      # undeclared union members, collapsing the type to `any` and failing
      # `tsc --noEmit`. Drop this once a fixed release is out.
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        versions: ["0.3.198 - 0.3.200"]
      # `openai` must stay on the major that @openai/agents-openai depends on
      # (^7.2.0 as of agents 0.16.0) — a solo major bump here installs a
      # *second* nested openai under it, and the two `OpenAI` classes are
      # structurally incompatible (private-field brand), so
      # setDefaultOpenAIClient() fails `tsc --noEmit` with TS2345. Bump the
      # major by hand together with the agents SDK.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      # @playwright/mcp bundles playwright-core, and the Camoufox endpoint
      # (python playwright, capped <1.61 by camoufox) rejects any client on
      # a different playwright MINOR with "428 Precondition Required" — every
      # browser tool call fails. #617 pinned 0.0.56 (= playwright 1.58) and
      # #634 bumped it the next day, silently killing the plugin. Bump BOTH
      # sides together by hand; see src/plugins/playwright/index.ts.
      - dependency-name: "@playwright/mcp"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Workflows pin actions to commit SHAs (with a `# vX.Y.Z` comment that
    # Dependabot keeps in step); the cooldown gives a bad tag time to be
    # noticed before it is proposed.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
