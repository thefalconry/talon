name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ── npm publish ────────────────────────────────────────────────
  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches engines (>=24) and the CI test matrix.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      # Pack once and publish that exact tarball, so the GitHub attestation
      # below covers the same bytes the registry serves (`npm pack
      # talon-agent@<v>` fetches them back for `gh attestation verify`).
      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -la dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Publish
        run: npm publish ./dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Verify the published package actually works ────────────────
  smoke-test:
    name: Smoke Test
    needs: [npm]
    runs-on: ubuntu-latest
    # Must clear the propagation poll (up to 10 minutes) plus install + verify.
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Publishing is asynchronous — npm says so itself on the way out:
      # "Your package is being processed and may take a few minutes to become
      # available." Two release runs have now been marked failed by a good
      # publish: v3.37.0 on a fixed 15s sleep, and v4.0.0 on a two-minute
      # poll that still gave up too early (4.0.0 was live minutes later).
      # Ten minutes covers what npm actually means by "a few minutes".
      #
      # --prefer-online matters as much as the window: without it npm can
      # keep serving the cached 404 from the first attempt, so the poll would
      # re-read its own stale miss instead of asking the registry again.
      - name: Wait for npm registry propagation
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            if npm view --prefer-online talon-agent@"$TAG_VERSION" version \
                 >/dev/null 2>&1; then
              echo "talon-agent@$TAG_VERSION is live (after ${attempt} check(s))"
              exit 0
            fi
            echo "not on the registry yet — retrying in 10s (${attempt}/60)"
            sleep 10
          done
          echo "::error::talon-agent@$TAG_VERSION never appeared on the registry"
          exit 1

      - name: Install published package
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm install talon-agent@"$TAG_VERSION"

      - name: Verify package contents
        run: |
          # Check critical files exist in installed package
          test -f node_modules/talon-agent/src/index.ts
          test -f node_modules/talon-agent/bin/talon.js
          test -d node_modules/talon-agent/prompts
          # Embedded native artifacts — a files[] regression here means the
          # package imports fail at runtime, not just at install time.
          test -f node_modules/talon-agent/src/native/blake3-wasm-bytes.ts
          test -f node_modules/talon-agent/src/native/textops-wasm-bytes.ts
          test -d node_modules/talon-agent/src/native/scheduler-core
          echo "Package contents verified"

      - name: Execute the installed CLI
        run: |
          # File-existence checks can't catch a broken bin shim or a bad
          # import graph — actually run the CLI from the installed package.
          VERSION_OUTPUT=$(./node_modules/.bin/talon --version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION_OUTPUT" != "$TAG_VERSION" ]; then
            echo "::error::talon --version printed '$VERSION_OUTPUT', expected '$TAG_VERSION'"
            exit 1
          fi
          ./node_modules/.bin/talon --help
          echo "CLI execution verified"

  # ── Docker image → GHCR ───────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Standalone binaries → release assets ───────────────────────
  # Bun cross-compiles every target from one Linux host (verified: the
  # `with { type: "file" }` prompt assets embed for cross targets too).
  # The CLI entry is src/cli.ts — the dispatcher the npm `talon` bin runs,
  # NOT src/index.ts (the daemon). Compile Smoke (ci.yml) already proved
  # the artifact boots on all three OSes; this job ships it.
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: npm ci

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Cross-compile all targets
        run: |
          # Regenerate the embedded-prompts manifest so the binaries always
          # embed exactly what's in prompts/, independent of the committed
          # (drift-guarded) copy.
          npm run build:prompts
          mkdir -p dist
          # bun target triple → published asset name (os-arch[.exe]).
          declare -A TARGETS=(
            [bun-linux-x64]=talon-linux-x64
            [bun-linux-arm64]=talon-linux-arm64
            [bun-darwin-x64]=talon-darwin-x64
            [bun-darwin-arm64]=talon-darwin-arm64
            [bun-windows-x64]=talon-windows-x64.exe
          )
          for triple in "${!TARGETS[@]}"; do
            out="dist/${TARGETS[$triple]}"
            echo "── $triple → $out"
            bun build --compile --target="$triple" src/cli.ts --outfile "$out"
          done
          ls -la dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum talon-* > SHA256SUMS

      # SLSA build provenance for every binary plus SHA256SUMS, verifiable
      # with `gh attestation verify <file> --repo thefalconry/talon`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # ── Linux packages (.deb, .rpm) → release assets ───────────────
  # Wraps the already-built linux binaries with nfpm (nfpm.yaml). Users
  # install with `apt install ./talon_<ver>_<arch>.deb` (Debian/Ubuntu) or
  # `dnf install ./talon-<ver>-1.<arch>.rpm` (Fedora/RHEL).
  deb:
    name: Linux packages (.deb, .rpm)
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'talon-linux-x64' --pattern 'talon-linux-arm64' --dir bin
          chmod +x bin/talon-linux-*

      - name: Install nfpm
        run: |
          VER=2.43.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${VER}/nfpm_${VER}_Linux_x86_64.tar.gz" -o /tmp/nfpm.tgz
          mkdir -p "$HOME/.nfpm-bin"
          tar -xzf /tmp/nfpm.tgz -C "$HOME/.nfpm-bin" nfpm
          echo "$HOME/.nfpm-bin" >> "$GITHUB_PATH"

      - name: Build .deb and .rpm for each arch
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # nfpm arch (Debian naming) → the matching linux binary.
          # nfpm does NOT expand ${VAR} inside contents[].src (only in
          # top-level scalar fields like arch/version), so copy each
          # arch's binary to the fixed path nfpm.yaml references instead
          # of templating src per-arch.
          # nfpm translates the Debian arch to RPM's (amd64 → x86_64,
          # arm64 → aarch64) itself; the third argument only names the file.
          build_pkgs() {
            export ARCH="$1"
            cp "$2" dist/talon-bin
            chmod +x dist/talon-bin
            nfpm package -f nfpm.yaml -p deb -t "dist/talon_${VERSION}_${ARCH}.deb"
            nfpm package -f nfpm.yaml -p rpm -t "dist/talon-${VERSION}-1.$3.rpm"
          }
          build_pkgs amd64 bin/talon-linux-x64 x86_64
          build_pkgs arm64 bin/talon-linux-arm64 aarch64
          ls -la dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --clobber

  # ── Homebrew tap bump ──────────────────────────────────────────
  # Bumps Formula/talon.rb in thefalconry/homebrew-talon to this version
  # with fresh per-os/arch SHA256s, so `brew install thefalconry/talon/talon`
  # tracks the latest release. Uses the cross-repo PAT (same secret
  # release-please uses); skips cleanly if it isn't configured.
  homebrew:
    name: Homebrew tap
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Bump tap formula
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT not set — skipping tap bump"
            exit 0
          fi
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="thefalconry/talon"
          TAP="thefalconry/homebrew-talon"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Fetch the checksums published by the `binaries` job and pull each
          # per-asset sha256 (keyed by the asset filename).
          gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS --dir /tmp --clobber
          sha() { grep " $1\$" /tmp/SHA256SUMS | cut -d' ' -f1; }
          SHA_LINUX_X64=$(sha talon-linux-x64)
          SHA_LINUX_ARM64=$(sha talon-linux-arm64)
          SHA_DARWIN_X64=$(sha talon-darwin-x64)
          SHA_DARWIN_ARM64=$(sha talon-darwin-arm64)

          cat > /tmp/talon.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for Talon — auto-bumped by the talon publish workflow.
          class Talon < Formula
            desc "Multi-frontend AI agent with full tool access, streaming, cron jobs, and plugins"
            homepage "https://github.com/thefalconry/talon"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/talon-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE}/talon-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/talon-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE}/talon-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              # Homebrew downloads the bare binary asset under its remote
              # basename (talon-<os>-<arch>); install it as `talon`.
              bin.install Dir["talon-*"].first => "talon"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/talon --version")
            end
          end
          EOF

          # Commit the regenerated formula to the tap via the contents API.
          gh api "repos/${TAP}/contents/Formula/talon.rb" --jq '.sha' > /tmp/sha.txt 2>/dev/null || echo "" > /tmp/sha.txt
          PREV_SHA=$(cat /tmp/sha.txt)
          ARGS=(-f message="talon ${VERSION}" -f content="$(base64 -w0 /tmp/talon.rb)")
          if [ -n "$PREV_SHA" ]; then ARGS+=(-f sha="$PREV_SHA"); fi
          gh api --method PUT "repos/${TAP}/contents/Formula/talon.rb" "${ARGS[@]}"
          echo "Bumped ${TAP} formula to ${VERSION}"
