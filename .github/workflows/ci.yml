name: CI

# ── What runs when ──────────────────────────────────────────────
# Nothing is deleted — every job still runs; the question is only when.
#
# Pull requests and merge-queue entries get a LIGHT, path-aware gate: PR
# title, typecheck/lint/format/knip (Code Quality), the unit suite on
# ubuntu, secret scan, npm audit, dependency review and lockfile
# portability. Heavier tiers join only when the change touches what they
# guard (native/** → the drift guards and the native addon/warden suites
# on ubuntu; Docker files → Docker Build; package.json → Tarball Check).
# Docs-only / companion-only changes run just the PR title + secret scan.
#
# The FULL matrix — all three OSes, backend-live, fuzz, docker, tarball —
# runs on every push to main, nightly at 03:00 UTC, on workflow_dispatch,
# and on any PR carrying the `full-ci` label. A failing full run on main
# opens (or updates) a "CI failing on main" issue; the next green full
# run closes it (see `ci-alert`).
#
# merge_group: the queue needs `CI Status` to report, so this workflow
# triggers on it. A queue entry runs the same path-aware light set as a
# PR (diffed base_sha...head_sha), full only if the PR has `full-ci` —
# the full matrix follows anyway on the resulting push to main, and
# running it per queue entry would put 11 macOS legs back on every merge.
#
# The `changes` job below decides all of that. It is an `if:` gate rather
# than `paths-ignore` on purpose: `CI Status` is the required check, and a
# workflow skipped by a path filter never reports it, which blocks the
# merge. Gating jobs keeps the workflow (and `CI Status`) running on every
# PR, and `CI Status` treats skipped jobs as passed, failed/cancelled ones
# as failed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so adding `full-ci` kicks off the full matrix straight
    # away. Other labels just rerun the light gate (the older run is
    # cancelled by the concurrency group).
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  schedule:
    # Nightly full matrix: catches runner-image and unpinned-transitive
    # drift on days nothing merges.
    - cron: "0 3 * * *"
  workflow_dispatch:

# PR runs are keyed by PR number and superseded by newer pushes; every
# push / merge_group / schedule / dispatch run gets its own group
# (run_id), so a main or queue run is never cancelled — not even while
# pending behind another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Scope: what this run has to cover ────────────────────────
  # Path-aware at the job level. Outputs (strings "true"/"false"):
  #   full     — push / schedule / dispatch, or the PR (also a queued PR)
  #              carries the `full-ci` label: run everything
  #   daemon   — anything beyond docs/**, apps/companion/** and loose
  #              *.md. prompts/** and src/** always count, *.md included
  #              (they ship in the binary); apps/node/** and protocol/**
  #              count too (src tests read them). Gates the light set.
  #   native   — native/** or src/native/** (drift guards + addon suites)
  #   docker   — Dockerfile, .dockerignore, docker/**, docker-compose*.yml
  #   package  — package.json / .npmignore / tarball checker (Tarball Check)
  #   Informational (their own workflows gate on them):
  #   companion — apps/companion/** or protocol/**   (companion.yml)
  #   node      — apps/node/** or protocol/**        (node.yml)
  #   native_provision — provisioner paths           (native-provision.yml)
  #   packaging — packaging/**, nfpm.yaml             (publish.yml)
  #   docs      — docs/** or loose *.md
  #   os        — JSON OS list for the cross-platform matrices
  # Any API failure fails this job, which fails `CI Status` — the gate
  # fails closed, never open.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      daemon: ${{ steps.scope.outputs.daemon }}
      native: ${{ steps.scope.outputs.native }}
      docker: ${{ steps.scope.outputs.docker }}
      package: ${{ steps.scope.outputs.package }}
      companion: ${{ steps.scope.outputs.companion }}
      node: ${{ steps.scope.outputs.node }}
      native_provision: ${{ steps.scope.outputs.native_provision }}
      packaging: ${{ steps.scope.outputs.packaging }}
      docs: ${{ steps.scope.outputs.docs }}
      os: ${{ steps.scope.outputs.os }}
    steps:
      - name: Classify the change set
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          MG_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          full=false daemon=false native=false docker=false package=false
          companion=false node=false native_provision=false packaging=false docs=false
          files=""
          case "$EVENT" in
            pull_request)
              ;;
            merge_group)
              # gh-readonly-queue/main/pr-123-<sha> → the PR's labels.
              PR=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$MG_REF")
              ;;
            *)
              full=true
              ;;
          esac
          if [[ "$full" != true ]]; then
            if [[ -n "$PR" ]]; then
              # Read live (not from the event payload) so "add full-ci,
              # then re-run" works. Captured first: an API error must fail
              # the job, not read as "no label".
              labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
              if grep -qx 'full-ci' <<<"$labels"; then full=true; fi
            fi
            # Renames count on both sides. The endpoints cap at 3000
            # files; at the cap, assume everything changed.
            if [[ "$EVENT" == merge_group ]]; then
              files=$(gh api --paginate "repos/$REPO/compare/$MG_BASE...$MG_HEAD" \
                --jq '.files[] | .filename, (.previous_filename // empty)')
            else
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')
            fi
            if [[ $(grep -c . <<<"$files" || true) -ge 3000 ]]; then
              echo "::notice::file list hit the API cap — running everything"
              full=true
            fi
          fi
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              docs/*) docs=true ;;
              apps/companion/*) ;;
              prompts/*|src/*) daemon=true ;;
              *.md) docs=true ;;
              *) daemon=true ;;
            esac
            case "$f" in apps/companion/*|protocol/*) companion=true ;; esac
            case "$f" in apps/node/*|protocol/*) node=true ;; esac
            case "$f" in native/*|src/native/*) native=true ;; esac
            case "$f" in Dockerfile|.dockerignore|docker/*|docker-compose*.yml) docker=true ;; esac
            case "$f" in packaging/*|nfpm.yaml) packaging=true ;; esac
            case "$f" in package.json|.npmignore|.github/scripts/tarball-check.mjs) package=true ;; esac
            case "$f" in
              src/core/plugin/*|src/plugins/*|src/core/mcp-hub/launcher.ts|src/util/runtime.ts|\
              src/__tests__/native-provision.test.ts|src/__tests__/integration/provision-real.test.ts|\
              src/__tests__/integration/mcp-stdio-probe.ts|.github/workflows/native-provision.yml)
                native_provision=true ;;
            esac
          done <<<"$files"
          if [[ "$full" == true ]]; then
            daemon=true native=true docker=true package=true
            companion=true node=true native_provision=true packaging=true docs=true
            os='["ubuntu-latest","macos-latest","windows-latest"]'
          else
            os='["ubuntu-latest"]'
          fi
          scope="full=$full
          daemon=$daemon
          native=$native
          docker=$docker
          package=$package
          companion=$companion
          node=$node
          native_provision=$native_provision
          packaging=$packaging
          docs=$docs"
          { echo "$scope"; echo "os=$os"; } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### CI scope ($EVENT)"
            echo ""
            echo "| area | run |"
            echo "|---|---|"
            sed -E 's/^ *([a-z_]+)=(.*)$/| \1 | \2 |/' <<<"$scope"
            echo ""
            [[ "$full" == true ]] || echo "Light gate. Add the \`full-ci\` label to run the full 3-OS matrix."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PR title must be a conventional commit ────────────────────
  # Squash merges use the PR title as the commit subject, and
  # release-please only counts typed commits (feat/fix/…) towards a
  # release. A typeless title merges fine but silently produces NO
  # release — exactly what happened with #521 ("macOS DMG install
  # UX + …"). Gate it here so the mistake can't reach main.
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate conventional-commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([^)]+\))?!?: .+'
          if [[ "$TITLE" =~ $regex ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "::error::Squash merges use the PR title as the commit subject; release-please needs a type (feat:/fix:/chore:/…) or the merge produces no release."
            exit 1
          fi

  # ── Lint, format, and type-check ──────────────────────────────
  quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries (dependency-cruiser)
        run: npm run depcruise

      # Dead exports/types/deps. Zero tolerance: the tree was swept clean in
      # the 2026-09 code-health pass (docs/code-health.md §4); anything new
      # is a fresh regression, not baseline.
      - name: Dead code (knip)
        run: npm run knip

      - name: Ratchet gates
        run: npm run ratchets

      - name: Function-size ratchet
        run: npm run function-size
      - name: Tree ratchet
        run: npm run tree

      - name: Check for .only/.skip in tests
        run: |
          if grep -rn '\.only\s*(' --include='*.test.ts' src/__tests__/ || \
             grep -rn '\.skip\s*(' --include='*.test.ts' src/__tests__/; then
            echo "::error::Found .only() or .skip() in test files — remove before merging"
            exit 1
          fi

      - name: Dead code analysis (informational)
        run: npm run knip -- --no-exit-code
        continue-on-error: true

      - name: Format check
        run: npm run format:check

  # ── Unit & integration tests + coverage ────────────────────────
  #
  # Light PR runs (pull_request only — merge_group runs the whole suite
  # as the last gate before main) use test-impact analysis on ubuntu:
  # scripts/tia.mjs picks the test files whose runtime import graph
  # (ci/test-impact-map.json) touches the PR's changes, plus a smoke set,
  # and falls back to the full suite for config/lockfile/scripts/native/
  # prompts changes or a stale map. Full runs (main, dispatch, `full-ci`) run everything with
  # coverage and re-record the map as the `test-impact-map` artifact,
  # which the next PR run downloads — the map is never committed back
  # from CI (main is protected; a bot push or refresh PR per merge would
  # be noise). The committed copy is only the bootstrap / offline
  # fallback; `node scripts/tia.mjs --refresh` updates it locally.
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # download the newest test-impact-map artifact
      pull-requests: read # list the PR's changed files
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only on a light PR run; all three OSes on main /
        # dispatch / `full-ci`. The ubuntu leg carries coverage —
        # instrumentation overhead is noise the macOS/Windows legs
        # already absorb.
        os: ${{ fromJSON(needs.changes.outputs.os) }}
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:ci

      # ── Light PR lane: impacted tests only ──
      - name: Select impacted tests (TIA)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && needs.changes.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Same change set the `changes` job classified (renames on both sides).
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          # Freshest map from main; the committed copy is the fallback.
          node scripts/tia.mjs --refresh || echo "::warning::Could not fetch the test-impact map from main; using the committed copy"
          node scripts/tia.mjs --files "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/tia-tests.txt"

      - name: Run impacted tests
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && needs.changes.outputs.full != 'true'
        # Empty selection = full suite (xargs runs a bare `vitest run`).
        run: xargs npx vitest run --reporter=verbose --reporter=json --outputFile=test-results.json < "$RUNNER_TEMP/tia-tests.txt"

      # ── Full runs: whole suite with coverage + re-record the map ──
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true')
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile=test-results.json --reporter=./scripts/tia-reporter.mjs --experimental.importDurations.limit=1000000

      - name: Upload test-impact map
        if: always() && matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true') && hashFiles('ci/test-impact-map.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-impact-map
          path: ci/test-impact-map.json
          retention-days: 30

      - name: Test summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs test-results.json "Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})" coverage/coverage-summary.json

      - name: Validate coverage report
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true')
        run: |
          node -e "if (!require('fs').existsSync('coverage/coverage-summary.json')) { console.error('Coverage report not generated'); process.exit(1); }"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: test-results.json
          retention-days: 14

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Cross-platform functional tests (subprocess spawn/teardown) ───────
  # The MCP launcher relies on pipe-EOF-on-parent-death being a kernel
  # guarantee on every OS Node supports. Validate that on Windows and macOS
  # as well as Linux so we catch platform regressions before they hit users.
  functional-cross-platform:
    name: Functional (${{ matrix.os }})
    # Heavy tier: main / dispatch / `full-ci` only.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Stub claude SEA build — only required on Windows (where Node 20.19+
      # CVE-2024-27980 blocks spawning .cmd shims via child_process.spawn).
      # POSIX uses the .mjs directly via shebang and skips the build.
      - name: Build stub claude SEA binary (Windows)
        if: runner.os == 'Windows'
        run: npm run build:stub-sea

      - name: Run cross-platform functional tests
        run: npm run test:functional

      - name: Functional summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs functional-results.json "Functional (${{ matrix.os }})"

      - name: Upload functional results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-results-${{ matrix.os }}
          path: functional-results.json
          retention-days: 14

  # ── MCP-functional integration tier ───────────────────────────
  # Drives a full Talon turn through the stub `claude` binary, real MCP
  # subprocess + JSON-RPC, real Gateway, real bridge HTTP, and a recording
  # action handler. This is the tier that catches SDK→MCP→bridge→handler
  # integration bugs (e.g. PR #122's prefix mismatch) without needing a
  # live external service. See `talon-mcp-functional.test.ts`.
  integration:
    name: Integration (${{ matrix.os }})
    # Heavy tier: main / dispatch / `full-ci` only.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build stub claude SEA binary (Windows)
        if: runner.os == 'Windows'
        run: npm run build:stub-sea

      - name: Run MCP-functional integration tests
        run: npm run test:integration

      - name: Integration summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs integration-results.json "Integration (${{ matrix.os }})"

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-results-${{ matrix.os }}
          path: integration-results.json
          retention-days: 14

  # ── Compiled-binary smoke (all OSes) ───────────────────────────
  # Compiles Talon to a standalone bun binary on every supported OS and
  # smoke-tests the REAL artifact from an isolated directory with no
  # source tree on disk — the install shape a published binary ships as.
  # Proves: prompts + version travel inside the binary (not read from a
  # missing source tree), the CLI boots (--version / --help / doctor),
  # and the MCP supervisor self-reinvocation (`_mcp-launch`) works
  # compiled. The prompt-manifest drift guard lives in the test job
  # (prompts-embed.test.ts), same as the SQL embed.
  compile-smoke:
    name: Compile Smoke (${{ matrix.os }})
    # Heavy tier: main / dispatch / `full-ci` only.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: npm ci

      - name: Compile standalone binary
        # The user-facing CLI entry (src/cli.ts) — same dispatcher the npm
        # `talon` bin runs — not src/index.ts (the daemon that eagerly
        # boots the agent). bun appends `.exe` on Windows.
        # build:prompts first: the embedded-prompts manifest is committed
        # and drift-guarded, but regenerating right before compile makes
        # the binary immune to a stale manifest regardless.
        shell: bash
        run: |
          npm run build:prompts
          bun build --compile src/cli.ts --outfile "$RUNNER_TEMP/talon"

      - name: CLI smoke (version / help / doctor) from an isolated cwd
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          BIN="$RUNNER_TEMP/talon$ext"
          # Run from a directory with no prompts/ or package.json on disk:
          # anything the binary needs must be embedded.
          # Read the expected version BEFORE leaving the workspace, via a
          # relative path — a Windows $GITHUB_WORKSPACE (D:\a\talon\talon)
          # interpolated into a JS string mangles its backslashes (\t, \a).
          expected=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          ver=$("$BIN" --version)
          echo "version: $ver (expected $expected)"
          [[ "$ver" == "$expected" ]] || { echo "::error::--version printed '$ver', expected '$expected'"; exit 1; }
          "$BIN" --help | grep -q "Talon" || { echo "::error::--help missing banner"; exit 1; }
          # doctor exits non-zero without a config (no config file is a
          # "fail" check), so tolerate that and assert on the embedded
          # prompt-template check instead — that line only prints if the
          # embedded prompts loaded.
          out=$("$BIN" doctor || true)
          echo "$out"
          echo "$out" | grep -q "Prompt templates loaded" \
            || { echo "::error::embedded prompts did not load in the compiled binary"; exit 1; }

      - name: Supervisor sanity (_mcp-launch supervises a child)
        # Unix only: Git Bash on Windows shadows `timeout` with the
        # incompatible Windows timeout.exe. The supervisor's Windows
        # process path is exercised by the warden/Job-Object tests.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ext=""
          BIN="$RUNNER_TEMP/talon$ext"
          # `timeout` is GNU coreutils — present on ubuntu, often absent on
          # macOS runners; fall back to running without it (the closing
          # pipe gives `cat` EOF, so the supervisor exits on its own).
          run_to() { if command -v timeout >/dev/null 2>&1; then timeout "$@"; else shift; "$@"; fi; }
          # Hold stdin open briefly: closing it instantly can SIGTERM the
          # child before the line round-trips through the supervisor.
          out=$({ echo '{"jsonrpc":"2.0","id":1,"method":"ping"}'; sleep 2; } | run_to 30 "$BIN" _mcp-launch cat)
          echo "supervisor stdout: $out"
          [[ "$out" == *'"method":"ping"'* ]] || { echo "::error::JSON line did not pass through supervisor"; exit 1; }
          err=$({ echo 'plain banner line'; sleep 2; } | run_to 30 "$BIN" _mcp-launch cat 2>&1 >/dev/null)
          echo "supervisor stderr: $err"
          [[ "$err" == *'mcp-launcher: stdout'* ]] || { echo "::error::non-JSON line was not rerouted to stderr"; exit 1; }

  # ── Gleam artifact drift guard ─────────────────────────────────
  # The scheduler decision core is Gleam compiled to JS with the
  # artifacts committed under src/native/. Rebuild from source and fail
  # if the committed artifacts drifted.
  gleam-artifact:
    name: Gleam Artifact
    # On PRs only when native/** or src/native/** changed.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache gleam toolchain
        id: gleam-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gleam-bin
          key: gleam-${{ runner.os }}-v1.17.0

      - name: Install gleam
        if: steps.gleam-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.gleam-bin"
          curl -fsSL https://github.com/gleam-lang/gleam/releases/download/v1.17.0/gleam-v1.17.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/gleam.tgz
          tar -xzf /tmp/gleam.tgz -C "$HOME/.gleam-bin"

      - name: Add gleam to PATH
        run: |
          echo "$HOME/.gleam-bin" >> "$GITHUB_PATH"
          "$HOME/.gleam-bin/gleam" --version

      - name: Rebuild and check drift
        run: |
          (cd native/scheduler-core && gleam build --target javascript && node embed.mjs)
          git diff --exit-code src/native/

  # ── Zig toolchain artifact drift guard ─────────────────────────
  # textops builds through the pinned zig toolchain
  # (native/.zig-version — codegen changes between releases, so the
  # version is part of the artifact contract), embedded as base64
  # under src/native/. Rebuild it from source and fail if the
  # committed bytes drifted.
  zig-artifact:
    name: Zig Toolchain Artifacts
    # On PRs only when native/** or src/native/** changed.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cache zig toolchain
        id: zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.zig-bin
          key: zig-${{ runner.os }}-${{ hashFiles('native/.zig-version') }}

      - name: Install zig (pinned)
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          ZIG_VERSION="$(cat native/.zig-version)"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig-bin"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig-bin" --strip-components=1

      - name: Add zig to PATH
        run: |
          echo "$HOME/.zig-bin" >> "$GITHUB_PATH"
          "$HOME/.zig-bin/zig" version

      - name: Rebuild and check drift
        run: |
          npm run build:zig
          git diff --exit-code src/native/textops-wasm-bytes.ts

      # The talon-driver launcher is a native per-arch binary (not an
      # embedded artifact), so there is nothing to drift-check — instead
      # cross-compile the whole distribution matrix as a build guard, so
      # a source change that breaks any target arch fails here.
      - name: Cross-compile the launcher (all targets)
        run: npm run build:driver:all

      # Run the launcher's behavior suite here — this is the only job with
      # the pinned zig toolchain, so it's where the build-and-drive tests
      # in src/__tests__/talon-driver.test.ts actually execute (elsewhere
      # they self-skip when zig is absent).
      - name: Driver behavior tests
        run: |
          npm ci
          npx vitest run src/__tests__/talon-driver.test.ts

  # ── WASM artifact reproducibility ──────────────────────────────
  # The Rust wasm crates (native/blake3-wasm, native/strsim-wasm,
  # native/sqlguard-wasm, native/htmlents-wasm) are committed alongside
  # their built artifacts, embedded as base64 under src/native/.
  # Rebuild from source and diff: if any committed bytes drift from the
  # committed Rust source (or someone hand-edits a generated module),
  # this fails. Toolchains are pinned per-crate by rust-toolchain.toml
  # so rustc codegen drift can't break the diff. Runs on the runner's own
  # node (embed.mjs uses only builtins) — independent of the repo's Node
  # version matrix.
  wasm-artifact:
    name: WASM Artifact Check
    # On PRs only when native/** or src/native/** changed.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            native/blake3-wasm
            native/strsim-wasm
            native/sqlguard-wasm
            native/htmlents-wasm

      - name: Rebuild wasm + regenerate embedded bytes
        run: npm run build:wasm

      - name: Committed bytes must match committed Rust source
        run: |
          git diff --exit-code \
            src/native/blake3-wasm-bytes.ts \
            src/native/strsim-wasm-bytes.ts \
            src/native/sqlguard-wasm-bytes.ts \
            src/native/htmlents-wasm-bytes.ts

  # ── Warden supervision harness ─────────────────────────────────
  # talon-warden (native/talon-warden) is a native per-arch Rust binary
  # like the launcher — nothing to drift-check. Build it with the pinned
  # toolchain (rust-toolchain.toml), run its unit tests, then run the
  # behavior suite plus the trigger supervisor suites over the real
  # binary — this is the job of record for the warden supervision path
  # (elsewhere the warden tests self-skip when cargo is absent, and the
  # trigger suites run the TS fallback). All three OSes: process groups +
  # pdeathsig vs ppid-polling (Unix) vs kill-on-close Job Objects
  # (Windows) are exactly the things that differ. The bash/signal
  # behaviour suite + trigger supervisor suites run on Unix; Windows runs
  # the cmd-based warden smoke suite over the real talon-warden.exe.
  warden:
    name: Warden (${{ matrix.os }})
    # On PRs only when native/** or src/native/** changed, and then ubuntu only.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/talon-warden

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/talon-warden

      - name: Build the harness
        run: npm run build:warden

      - name: Warden behavior + trigger supervisor suites (warden path)
        if: runner.os != 'Windows'
        run: |
          npm ci
          npx vitest run src/__tests__/talon-warden.test.ts \
            src/__tests__/triggers.test.ts \
            src/__tests__/triggers-extended.test.ts

      - name: Warden smoke suite (Windows, Job Object path)
        if: runner.os == 'Windows'
        run: |
          npm ci
          npx vitest run src/__tests__/talon-warden.test.ts

  # ── Blake3 napi addon ──────────────────────────────────────────
  # blake3-napi (native/blake3-napi) is a per-arch .node library like
  # the warden is a per-arch binary — nothing to drift-check. Build it
  # with the pinned toolchain, run its unit tests, then drive the real
  # artifact through the TS boundary: digest agreement with the wasm
  # twin, fallback modes, and the media-index consumer. This is the job
  # of record for the native hashing path (elsewhere the napi tests
  # self-skip when cargo is absent and hashing uses the wasm fallback).
  # All three OSes: cdylib loading and mmap behaviour differ, and the
  # addon must prove it builds + loads on the Windows MSVC toolchain
  # rather than silently riding the wasm fallback there.
  napi:
    name: Blake3 Napi (${{ matrix.os }})
    # On PRs only when native/** or src/native/** changed, and then ubuntu only.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/blake3-napi

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/blake3-napi

      - name: Build the addon
        run: npm run build:napi

      - name: Addon behavior + wasm parity + media-index consumer
        # Pin to a single persistent fork. These three files load the
        # native blake3 .node addon and a real better-sqlite3 handle;
        # under vitest's default multi-fork pool the per-file worker
        # churn intermittently dies with "Worker exited unexpectedly"
        # (the tests themselves pass first). One fork, run sequentially,
        # removes the concurrent native-addon load/teardown that causes
        # the flake without changing any test logic.
        # shell: bash so the multi-line `\` continuations run identically
        # on Windows (the default shell there is pwsh, which breaks on `\`).
        shell: bash
        run: |
          npm ci
          npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1 \
            src/__tests__/blake3-napi.test.ts \
            src/__tests__/blake3-wasm.test.ts \
            src/__tests__/media-index.test.ts

  # ── Namespace FUSE addon ───────────────────────────────────────
  # talon-fusefs (native/talon-fusefs) is a per-arch .node library like
  # blake3-napi — nothing to drift-check. Build it with the pinned
  # toolchain, run its unit tests, then drive the REAL artifact through
  # a live kernel mount: symlink serving, live synthetic reads from
  # this process and from child processes, EROFS/ENOENT, and clean
  # unmount. TALON_REQUIRE_FUSE_LIVE=1 turns a silent capability skip
  # into a failure, so this job can never go green without mounting.
  # Linux only — the addon mounts through fusermount, a Linux facility;
  # every other host runs the (also tested) fuseless degradation path.
  fusefs:
    name: Namespace FUSE (ubuntu-latest)
    # On PRs only when native/** or src/native/** changed.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/talon-fusefs

      # A version banner is not a mount. The old check only proved
      # /dev/fuse existed and fusermount3 could print --version, so a
      # runner that had lost the *permission* to mount still walked past
      # it and surfaced as an opaque assertion failure in the live suite
      # (2026-07-29: "fusermount3: mount failed: Operation not permitted"
      # on ubuntu-latest, with this step green). Probe the capability
      # itself, and print the state a human needs to tell an environment
      # regression from a code regression.
      #
      # The cause, found by this probe on 2026-07-30: GitHub's runner
      # fleet is not uniform. Some images carry a self-built libfuse in
      # /usr/local/bin, which precedes /usr/bin on PATH:
      #
      #   passing runner: /usr/bin/fusermount3        3.14.0  -rwsr-xr-x root
      #   failing runner: /usr/local/bin/fusermount3  3.18.2  -rwxrwxrwx runner
      #
      # An unprivileged user cannot mount FUSE through a fusermount3 that
      # is not setuid root — the kernel refuses, and libfuse reports it as
      # "Operation not permitted". fuser is built default-features = false,
      # so it shells out to whichever fusermount3 PATH resolves; land on an
      # image with the impostor and the mount cannot succeed. Nothing
      # intermittent about it, and nothing to do with AppArmor: the
      # apparmor_restrict_unprivileged_userns knob is 1 on both, and
      # A/B-ing it (same commit, job matrixed over setting it to 0) passed
      # on both legs. Don't reintroduce that workaround.
      #
      # So: probe, then guarantee. If the resolved binary isn't setuid
      # root, put the system one back in front rather than failing on a
      # runner that is perfectly capable of mounting.
      - name: Host FUSE capability (probe, then guarantee setuid fusermount3)
        run: |
          set -x
          test -e /dev/fuse
          ls -l /dev/fuse
          id
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
          aa-enabled 2>/dev/null || true

          set +x
          resolved="$(command -v fusermount3 || command -v fusermount || true)"
          if [ -z "$resolved" ]; then
            echo "::error::no fusermount3/fusermount on PATH"
            exit 1
          fi
          echo "resolved: $resolved"
          ls -l "$resolved"
          "$resolved" --version || true

          setuid_root() {
            [ -u "$1" ] && [ "$(stat -c %u "$1")" = "0" ]
          }

          if setuid_root "$resolved"; then
            echo "ok: $resolved is setuid root"
          elif setuid_root /usr/bin/fusermount3; then
            echo "::warning::$resolved is $(stat -c '%A %U:%G' "$resolved"), not setuid root; prepending /usr/bin so the setuid system binary wins"
            echo "/usr/bin" >> "$GITHUB_PATH"
            ls -l /usr/bin/fusermount3
          else
            echo "::error::no setuid-root fusermount3 on this host ($resolved is $(stat -c '%A %U:%G' "$resolved")). An unprivileged FUSE mount cannot succeed: runner-image problem, not a code regression."
            exit 1
          fi

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/talon-fusefs

      - name: Build the addon
        run: npm run build:fusefs

      - name: Live mount + degradation + namespace suites
        env:
          TALON_REQUIRE_FUSE_LIVE: "1"
        run: |
          npm ci
          npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1 \
            src/__tests__/fusefs-live.test.ts \
            src/__tests__/vfs-fusefs.test.ts \
            src/__tests__/vfs.test.ts \
            src/__tests__/vfs-rewrite.test.ts \
            src/__tests__/vfs-nsdir.test.ts \
            src/__tests__/native-vfs-address.test.ts

  # ── Real backend live integration tier ───────────────────────
  # Installs the real backend CLI, then exercises the deployed backend surface
  # that fixture tests cannot fully represent: Kilo/OpenCode live HTTP model
  # discovery and Claude Code's real SDK subprocess/model-discovery bridge.
  backend-live:
    name: Backend Live (${{ matrix.backend }}, ${{ matrix.os }})
    # Heavy tier: main / dispatch / `full-ci` only.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Live model discovery is primarily a backend/schema contract.
          # Run the full matrix on POSIX where the provider servers are
          # stable and fast. This is also the only tier that installs the
          # backend CLIs, so the real-bootstrap suites (kilo/opencode:
          # production bootstrap() against a live `serve` process) run
          # here via `test:<backend>:backend` — in the unit tier they
          # skip for lack of a CLI. `*_LIVE_REQUIRED=1` below turns that
          # skip into a failure so a broken install can't pass silently.
          - os: ubuntu-latest
            backend: kilo
          - os: ubuntu-latest
            backend: opencode
          - os: ubuntu-latest
            backend: claude
          - os: ubuntu-latest
            backend: codex
          - os: ubuntu-latest
            backend: openai-agents
          - os: macos-latest
            backend: kilo
          - os: macos-latest
            backend: opencode
          - os: macos-latest
            backend: claude
          - os: macos-latest
            backend: codex
          - os: macos-latest
            backend: openai-agents
          # Windows runners are consistently slower and flakier for the
          # long-lived provider-server CLIs. Keep Windows coverage where it
          # catches real Windows-specific process resolution: subprocess
          # backends that execute installed CLI binaries directly. The
          # broader Windows process/MCP coverage remains in the unit,
          # functional, and integration tiers above.
          - os: windows-latest
            backend: claude
          - os: windows-latest
            backend: codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install backend CLI
        run: node .github/scripts/install-backend-cli.mjs ${{ matrix.backend }}

      - name: Run backend live tests
        run: npm run test:${{ matrix.backend }}:backend
        env:
          CLAUDE_LIVE_REQUIRED: "1"
          KILO_LIVE_REQUIRED: "1"
          OPENCODE_LIVE_REQUIRED: "1"
          CODEX_LIVE_REQUIRED: "1"

      - name: Backend live summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs ${{ matrix.backend }}-backend-results.json "Backend Live (${{ matrix.backend }}, ${{ matrix.os }})"

      - name: Upload backend live results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-live-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ matrix.backend }}-backend-results.json
          retention-days: 14

  # ── Fuzz testing (property-based with fast-check) ─────────────
  fuzz:
    name: Fuzz Testing
    # Heavy tier: main / dispatch / `full-ci` only.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run fuzz tests (extended iterations)
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=fuzz-results.json src/__tests__/fuzz.test.ts
        env:
          FAST_CHECK_NUM_RUNS: "10000"

      - name: Fuzz summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs fuzz-results.json "Fuzz Test Results (10,000 iterations/property)"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 14

  # ── Security audit ────────────────────────────────────────────
  security:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # --package-lock-only audits straight from the lockfile — the
      # advisory check doesn't need a node_modules install.
      - name: Audit production dependencies (fail on high)
        # What ships to users: a high-severity advisory blocks the merge.
        run: npm audit --omit=dev --audit-level=high --package-lock-only

      - name: Audit all dependencies (fail on critical)
        # Dev tooling never ships, but it runs in CI; keep the old bar.
        run: npm audit --audit-level=critical --package-lock-only

  # ── Secret scanning ───────────────────────────────────────────
  # Catches hardcoded credentials anywhere in the working tree —
  # API keys, bot tokens, .env files committed by accident, OAuth
  # secrets in configs, private keys. Runs on every push + PR.
  # Runs gitleaks directly rather than via gitleaks-action so the scanned
  # SCOPE is pinned and printed — see the comment on the scan step.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs full history to scan past commits — shallow checkout
          # would only catch leaks in the latest commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan this ref's own history
        run: |
          # THE SCOPE IS THE POINT.
          #
          # gitleaks-action picks the commit range for you, and the range it
          # picks is not stable: on a plain push it walks `--all` — every ref
          # the runner fetched, including commits on unmerged PR branches and
          # even orphaned ones left behind by a rebase; on other pushes it ran
          # `--log-opts=-1`, i.e. a single commit. Both are reported the same
          # way, so a green told you nothing about what was actually scanned.
          #
          # That coupling is not theoretical: on 2026-07-30 main went red over
          # a test fixture in commit 819c7473, which is not an ancestor of main
          # and no longer exists on any branch (#688). main's health should not
          # depend on other people's in-flight work.
          #
          # `--log-opts=HEAD` scans exactly the checked-out ref's own history:
          # main's history on a push to main, base + PR commits on the
          # pull_request merge ref. Nothing else. The commit count gitleaks
          # prints is then a meaningful statement about what passed.
          /tmp/gitleaks detect --source . --log-opts=HEAD \
            --redact --verbose --no-banner --exit-code 1

  # ── Dependency review (PR-only) ───────────────────────────────
  # On every PR, GitHub's dependency-review-action diffs lockfile changes
  # against the GitHub Advisory Database — any newly-introduced dep with a
  # known CVE fails the gate. Catches Dependabot PRs that bump TO a
  # vulnerable version (rare but happens) and human PRs that add risky deps.
  dep-review:
    name: Dependency Review
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.daemon == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # ── Lockfile portability ──────────────────────────────────────
  # Catches the Dependabot transitive-vuln pattern: a wide
  # `npm install --include=optional` produces a lockfile that only
  # validates with the flag set, breaking CI's plain `npm ci`. The
  # other test jobs run `npm ci` in the source tree where node_modules
  # state could mask issues — this job copies ONLY package.json +
  # package-lock.json to a fresh tmpdir and runs `npm ci` there.
  lockfile:
    name: Lockfile Portability
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Note: NO cache — fresh tmpdir means no cached node_modules
          # state can paper over portability bugs.

      - name: Upgrade to latest npm
        # The lockfile's canonical form is whatever the newest npm writes.
        # Older npms prune transitive deps of platform-gated optional
        # packages when they rewrite the lock (PR #786: a lock written by
        # npm 11.6 dropped @emnapi/runtime, needed by @img/sharp-wasm32,
        # and every `npm ci` job failed with a message that named neither
        # the cause nor the fix). Check with the npm developers are
        # expected to run, not whatever setup-node happened to bundle.
        run: |
          npm install -g npm@latest
          echo "node $(node --version) / npm $(npm --version)"

      - name: Verify package-lock.json is in sync with package.json
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --exit-code --stat -- package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json is not what the latest npm resolves from package.json — it was likely (re)written by an outdated npm, which silently prunes platform-optional transitive deps and breaks 'npm ci' for every other job. Fix: npm install -g npm@latest && npm install --package-lock-only, then commit the result."
            exit 1
          fi
          echo "::notice::package-lock.json is canonical under npm $(npm --version)"

      - name: Verify package-lock.json portability
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          cp package.json package-lock.json "$tmpdir/"
          # Skip postinstall scripts — those need files outside
          # package.json/lock that wouldn't be present in the tmpdir.
          # The check is purely "does the lockfile resolve all deps"
          # not "does the full build run."
          (cd "$tmpdir" && npm ci --ignore-scripts --no-audit --foreground-scripts)
          echo "::notice::package-lock.json is portable"

  # ── Docker build validation ───────────────────────────────────
  docker:
    name: Docker Build
    # On PRs only when Docker files changed.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: talon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The appliance path (docs/truenas.md): run as TrueNAS's `apps` user
      # with HOME on one bind-mounted dataset, and let the entrypoint seed
      # config.json from TALON_* env on first boot. CMD is swapped for a
      # no-op so this checks the entrypoint and image, not a live backend.
      - name: Smoke-test entrypoint as an arbitrary UID
        run: |
          set -eux
          data="$(mktemp -d)"
          sudo chown 568:568 "$data"
          docker run --rm --user 568:568 -e HOME=/data -v "$data:/data" \
            -e TALON_BACKEND=agy talon:ci true
          sudo test -f "$data/.talon/config.json"
          sudo cat "$data/.talon/config.json"
          sudo grep -q '"frontend": "native"' "$data/.talon/config.json"
          sudo grep -q '"backend": "agy"' "$data/.talon/config.json"
          sudo grep -q '"host": "0.0.0.0"' "$data/.talon/config.json"
          test "$(sudo stat -c %u "$data/.talon/config.json")" = 568
          test "$(sudo stat -c %a "$data/.talon/config.json")" = 600
          # A second boot must leave the operator's config alone.
          docker run --rm --user 568:568 -e HOME=/data -v "$data:/data" \
            -e TALON_BACKEND=codex talon:ci true
          sudo grep -q '"backend": "agy"' "$data/.talon/config.json"
          # Tools the agy backend shells out to, and claude on PATH.
          docker run --rm --user 568:568 talon:ci sh -c \
            'git --version && rg --version && command -v claude && id -un'

      # The default layout is one data root at /data, with no HOME override;
      # a container started with only the OLD layout's mount
      # (/home/bun/.talon holding a Talon install) must stay on it rather
      # than boot an empty Talon from /data.
      - name: Smoke-test data-root layout and old-layout detection
        run: |
          set -eux
          data="$(mktemp -d)"
          sudo chown 1000:1000 "$data"
          # (seed-config prints its own line first on a fresh data root)
          test "$(docker run --rm -v "$data:/data" talon:ci sh -c 'echo $HOME:$TALON_CONTAINER' | tail -n1)" = "/data:1"
          sudo test -f "$data/.talon/config.json"
          legacy="$(mktemp -d)"
          echo '{}' > "$legacy/config.json"
          sudo chown -R 1000:1000 "$legacy"
          out="$(docker run --rm -v "$legacy:/home/bun/.talon" talon:ci sh -c 'echo $HOME:$TALON_LAYOUT' 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'found Talon data at /home/bun/.talon'
          echo "$out" | tail -n1 | grep -qx '/home/bun:legacy'
          # The operator's old config was left alone.
          test "$(sudo cat "$legacy/config.json")" = '{}'

  # ── Tarball / publish dry-run ─────────────────────────────────
  # `npm pack --dry-run` would just list files. Our custom checker
  # *additionally* asserts on the contents — no .env, no test fixtures,
  # no source maps, no sshkeys, total size under the ceiling, README +
  # package.json present. Catches publish-time regressions before they
  # ship a leaky tarball to npm.
  tarball:
    name: Tarball Check
    # On PRs only when package.json / the checker changed.
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate npm tarball contents
        # `npm pack` reads package.json files[] from the source tree and
        # the checker uses only node builtins — no install needed.
        run: npm run tarball:check

      # Publish the daemon tarball from main as a workflow artifact — the
      # exact `npm pack` output the checker just validated. Anything that
      # needs a built daemon (manual smoke tests, a companion/node job that
      # wants to drive a real daemon) can `actions/download-artifact` it
      # from the latest main run instead of rebuilding from source.
      - name: Pack daemon tarball (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Upload daemon tarball (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talon-daemon-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 14

  # ── Final status gate ─────────────────────────────────────────
  # All required jobs MUST pass for `CI Status` to be green. Branch
  # protection (`.github/branch-protection.json`) gates merges on this
  # single check, so adding a new required job means adding it here too.
  #
  # On a pull_request run that was itself cancelled (superseded in the
  # concurrency group — e.g. release-please opening and labelling a PR in
  # the same second, which starts two runs for one commit) the gate is
  # skipped instead of reporting a failure: the surviving run on the same
  # commit reports the real verdict. Push, merge_group, schedule and
  # dispatch runs are never concurrency-cancelled, so there a cancellation
  # still reports as failed and can't let anything through.
  ci-ok:
    name: CI Status
    if: ${{ always() && (github.event_name != 'pull_request' || !cancelled()) }}
    needs:
      - changes
      - pr-title
      - quality
      - test
      - functional-cross-platform
      - integration
      - compile-smoke
      - gleam-artifact
      - zig-artifact
      - wasm-artifact
      - warden
      - napi
      - backend-live
      - fuzz
      - security
      - secrets
      - lockfile
      - docker
      - tarball
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs
        env:
          # Single source of truth: every job in the `needs` list above
          # is checked automatically — no second hand-written list to
          # forget when adding a job. Skipped = passed (the light PR gate
          # skips the heavy tiers by design); failure or cancelled = failed.
          # `changes` is in the list too: if scoping fails, every gated
          # job is skipped, and this still goes red.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          fail=0
          while IFS=$'\t' read -r name result; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$name' failed (result=$result)"
              fail=1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          if [[ $fail -eq 1 ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result | if . == "success" then "pass" elif . == "skipped" then "skipped" else "FAIL (\(.))" end) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Surface failures on main ───────────────────────────────────
  # PRs only block on the light gate, so the full matrix on main (push,
  # nightly, dispatch) is where platform breaks show up. Make them loud:
  # a failing full run opens — or comments on — one "CI failing on main"
  # issue with the run link and the failing jobs; the next green full run
  # closes it. Never runs for PRs or merge-queue entries.
  ci-alert:
    name: CI Alert (main)
    needs: ci-ok
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the "CI failing on main" issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE: ${{ needs.ci-ok.result }}
        with:
          script: |
            const title = "CI failing on main";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 8);
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            })).filter((i) => !i.pull_request && i.title === title);

            if (process.env.GATE === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `Green again: full CI passed on \`${sha}\` (${context.eventName}) — ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                  state: "closed", state_reason: "completed" });
                core.info(`closed #${issue.number}`);
              }
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: "latest", per_page: 100,
            });
            const bad = jobs.filter((j) => ["failure", "timed_out", "cancelled"].includes(j.conclusion)
              && j.name !== "CI Status");
            const list = bad.length
              ? bad.map((j) => `- [${j.name}](${j.html_url}) — ${j.conclusion}`).join("\n")
              : "- (no failing job found — see the run)";
            const body = [
              `Full CI failed on \`${sha}\` (${context.eventName}): ${runUrl}`,
              "",
              "Failing jobs:",
              list,
            ].join("\n");

            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
              core.info(`updated #${open[0].number}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title,
                body: `${body}\n\nThis issue is managed by \`ci.yml\` (\`ci-alert\`): later failures comment here, and the next green full run on main closes it.` });
              core.info(`opened #${data.number}`);
            }
