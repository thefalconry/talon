name: E2E daemon

# Runs when the script or this file changes. Main, nightly and `full-ci`
# runs are the e2e-daemon job in ci.yml.
on:
  pull_request:
    paths:
      - scripts/e2e-daemon.mjs
      - .github/workflows/e2e-daemon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/e2e-daemon.mjs
        env:
          E2E_LOG: ${{ runner.temp }}/daemon.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: daemon-log
          path: ${{ runner.temp }}/daemon.log
