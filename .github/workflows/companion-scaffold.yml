name: Companion Scaffold Platforms

# One-shot / on-demand maintenance job: generates the per-OS Flutter runner
# folders (macos/, android/, ...) with our required patches already applied,
# and commits them to the branch as real tracked source.
#
# Why this exists: apps/companion previously treated macos/ and android/ as
# disposable scaffolding (gitignored, regenerated via `flutter create` on
# every dev machine AND on every CI build/release). That meant our
# entitlement/manifest fixes lived in standalone scripts nobody — including
# the release pipeline itself — reliably ran after regenerating. Flutter's
# own convention is to commit these folders like normal source; this job
# does that scaffold-once step so the repo stops regenerating from scratch.
#
# `flutter create` only templates files — it doesn't need the target OS's
# toolchain (Xcode/Android SDK) to *generate* the folders, only to build
# them — so this safely runs on ubuntu-latest for every platform.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms to scaffold"
        required: false
        default: "macos,android"

permissions:
  contents: write

# It commits to the branch it runs on: serialize per branch, never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold platforms
        run: |
          flutter create --platforms="${{ github.event.inputs.platforms }}" \
            --project-name=talon_companion .

      - name: Apply macOS network entitlement fix
        if: contains(github.event.inputs.platforms, 'macos')
        run: ./scripts/fix-macos-entitlements.sh

      - name: Apply Android cleartext fix
        if: contains(github.event.inputs.platforms, 'android')
        run: ./scripts/fix-android-cleartext.sh

      - name: Untrack scaffolded platforms from .gitignore
        run: |
          for p in $(echo "${{ github.event.inputs.platforms }}" | tr ',' ' '); do
            sed -i "\#^/${p}/\$#d" .gitignore
          done

      - name: Commit generated platform sources
        run: |
          git config user.name "claudiusthebot"
          git config user.email "claudiusthebot@gmail.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit \
            -m "chore(companion): commit generated platform sources (${{ github.event.inputs.platforms }})" \
            -m "Scaffolded via flutter create + our fix scripts, then tracked as real source instead of being regenerated from scratch on every build. See companion-scaffold.yml for why." \
            -m "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push origin HEAD:"${{ github.ref_name }}"
