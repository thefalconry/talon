name: Companion Apps

# Builds the Flutter companion for Windows, macOS, Linux, and Android.
# On a published Release, the artifacts are attached to it. On PRs touching
# the app (or manual dispatch) it just builds + uploads workflow artifacts so
# the pipeline can be verified before a real release.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      # Shared protocol fixtures — the companion's conformance tests replay
      # them (protocol/README.md), so a protocol change must run this suite.
      - "protocol/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: write

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-coverage
          path: apps/companion/coverage/lcov.info

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/companion
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            build: flutter build windows --release
          - name: macOS
            os: macos-latest
            platform: macos
            build: flutter build macos --release
          - name: Linux
            os: ubuntu-latest
            platform: linux
            build: flutter build linux --release
          - name: Android
            os: ubuntu-latest
            platform: android
            build: flutter build apk --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop deps
        if: matrix.platform == 'linux'
        working-directory: .
        # libayatana-appindicator3-dev: tray_manager's Linux implementation
        # links against it (Windows tray residency pulls the plugin in for
        # every desktop target). libsecret-1-dev: flutter_secure_storage's
        # Linux implementation (the app lock's record lives in the Secret
        # Service); the runtime libsecret-1-0 ships with every desktop and
        # the Flatpak runtime.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # macos/ and android/ are committed real source (see
      # companion-scaffold.yml for why) — only windows/ and linux/ are still
      # gitignored scaffolding regenerated fresh per build.
      - name: Regenerate platform scaffolding
        if: matrix.platform == 'windows' || matrix.platform == 'linux'
        run: flutter create --platforms=${{ matrix.platform }} --project-name=talon_companion .

      # local_auth_windows (the app lock's Windows Hello prompt) compiles with
      # /await and <experimental/coroutine>, which MSVC 14.51+ turns into a hard
      # error unless this macro is defined. windows/ is regenerated above, so
      # define it for every target there; drop once the plugin moves to C++20
      # coroutines.
      - name: Allow local_auth_windows on current MSVC
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^project(/a add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          grep -q _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS windows/CMakeLists.txt

      # The dart package stays talon_companion (valid identifier), but every
      # user-facing name should read "Talon": the native window title, and on
      # Windows the .exe's ProductName/FileDescription (shown in Task Manager /
      # file properties). These runner files are regenerated above, so patch
      # them here. Non-fatal so a template change never breaks a build.
      - name: Set desktop app name to Talon
        if: matrix.platform == 'windows' || matrix.platform == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sed -i 's/"talon_companion"/"Talon"/g' linux/runner/my_application.cc || true
          else
            sed -i 's/L"talon_companion"/L"Talon"/g' windows/runner/main.cpp || true
            sed -i 's/\(VALUE "FileDescription", \)"talon_companion"/\1"Talon"/' windows/runner/Runner.rc || true
            sed -i 's/\(VALUE "ProductName", \)"talon_companion"/\1"Talon"/' windows/runner/Runner.rc || true
          fi

      # windows/ is regenerated each build, so its launcher icon must be
      # (re)generated here from the committed source art to match the app icon
      # shipped for android/macos. Non-fatal so an icon-tool hiccup never blocks
      # the build.
      - name: Generate Windows launcher icon
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run flutter_launcher_icons -f icons-windows.yaml || true

      # The app version tracks Talon's own (release-please bumps
      # package.json every release) — nothing is hand-bumped. versionCode
      # must be a monotonically increasing int for Android upgrades:
      # MAJOR*100000 + MINOR*1000 + PATCH (1.33.0 → 133000).
      - name: Derive app version from Talon release
        shell: bash
        run: |
          set -euo pipefail
          # Relative require: $GITHUB_WORKSPACE is a backslash path on
          # Windows and turns into escape sequences inside the JS string.
          VERSION=$(node -p "require('../../package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          BUILD_NUMBER=$((MAJOR * 100000 + MINOR * 1000 + PATCH))
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Companion version: $VERSION ($BUILD_NUMBER)"
          # Rewrite pubspec.yaml so desktop builds (Linux/Windows) embed the release
          # version into flutter_assets/version.json rather than building with 1.0.0.
          sed -i.bak "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml

      # Stable release signing (see android/app/build.gradle.kts): decode
      # the keystore secret so every release APK carries the same signature
      # and installs over the previous one. Skipped (falls back to debug
      # signing) when the secret isn't configured, e.g. on forks.
      - name: Set up Android release keystore
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — falling back to debug signing."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/talon-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          {
            echo "TALON_ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "TALON_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: ${{ matrix.build }} --build-name="$APP_VERSION" --build-number="$APP_BUILD_NUMBER" --dart-define=TALON_COMMIT="${GITHUB_SHA:0:7}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          DEST="$GITHUB_WORKSPACE/apps/companion/dist"
          case "${{ matrix.platform }}" in
            windows)
              # Portable zip of the raw Release folder…
              ( cd build/windows/x64/runner/Release && 7z a "$DEST/talon-companion-windows.zip" ./* )
              # …plus a double-click Setup.exe (the Windows counterpart of the
              # macOS DMG), compiled from the committed .iss with Inno Setup
              # (preinstalled on windows-latest; choco is a fallback).
              #
              # Switches use `-`, not `/`: Git Bash rewrites any argument that
              # starts with `/` into a Windows path, which turned `/DAppVersion=…`
              # into a second "script filename" and failed the compile.
              #
              # On a release a failure degrades to the portable zip so the asset
              # is never lost; on a PR / manual run it fails the job, so a broken
              # installer can't hide behind a green check.
              installer_failed() {
                if [ "${{ github.event_name }}" = "release" ]; then
                  echo "::warning::$1 — shipping portable zip only"
                else
                  echo "::error::$1"
                  exit 1
                fi
              }
              command -v ISCC.exe >/dev/null 2>&1 || choco install innosetup --no-progress -y || true
              RELEASE_DIR="$GITHUB_WORKSPACE/apps/companion/build/windows/x64/runner/Release"
              if ISCC.exe \
                  "-DAppVersion=$APP_VERSION" \
                  "-DSourceDir=$RELEASE_DIR" \
                  "-O$DEST" \
                  installer/windows/talon-companion.iss; then
                if [ -f "$DEST/talon-companion-windows-setup.exe" ]; then
                  echo "Built talon-companion-windows-setup.exe"
                else
                  installer_failed "ISCC reported success but no setup.exe was written"
                fi
              else
                installer_failed "ISCC failed"
              fi
              ;;
            macos)
              # Ship a decorated drag-to-Applications DMG: branded background
              # with a drag arrow, pinned icon layout, volume icon, and a
              # proper Applications drop link (create-dmg writes the Finder
              # .DS_Store, which is what makes the layout + link icon render
              # instead of a bare white window with a blank symlink).
              APP="build/macos/Build/Products/Release/Talon.app"

              # Ad-hoc re-sign the whole bundle (free, no Apple account).
              # It can't remove Gatekeeper's first-open warning — that needs
              # paid notarization — but it keeps the signature seal coherent
              # so arm64 Macs don't refuse the binary outright. The DMG
              # background documents the right-click → Open escape hatch.
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict "$APP"

              # Volume icon: build a .icns from the committed 1024px app icon.
              ICONSET="$RUNNER_TEMP/talon.iconset"
              mkdir -p "$ICONSET"
              for s in 16 32 64 128 256 512; do
                sips -z "$s" "$s" assets/icon/talon_icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
                sips -z "$((s * 2))" "$((s * 2))" assets/icon/talon_icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns "$ICONSET" -o "$RUNNER_TEMP/talon.icns"

              # Retina background: fold the committed 1x/2x PNGs (rendered by
              # scripts/render-dmg-background.py) into one HiDPI TIFF.
              BG="$RUNNER_TEMP/dmg-background.tiff"
              tiffutil -cathidpicheck assets/dmg/dmg-background.png assets/dmg/dmg-background@2x.png \
                -out "$BG" || BG="assets/dmg/dmg-background.png"

              brew list create-dmg >/dev/null 2>&1 || brew install create-dmg

              STAGE=$(mktemp -d)
              cp -R "$APP" "$STAGE/"
              OUT="$DEST/talon-companion-macos.dmg"
              # create-dmg drives Finder via AppleScript and can flake on CI
              # runners — never let a cosmetic failure cost the release asset:
              # fall back to the old undecorated hdiutil DMG.
              if ! create-dmg \
                  --volname "Talon" \
                  --volicon "$RUNNER_TEMP/talon.icns" \
                  --background "$BG" \
                  --window-pos 200 120 \
                  --window-size 660 400 \
                  --icon-size 128 \
                  --icon "Talon.app" 180 195 \
                  --hide-extension "Talon.app" \
                  --app-drop-link 480 195 \
                  --no-internet-enable \
                  "$OUT" "$STAGE"; then
                echo "::warning::create-dmg failed — shipping plain hdiutil DMG instead"
                ln -s /Applications "$STAGE/Applications"
                hdiutil create -volname "Talon" -srcfolder "$STAGE" -ov -format UDZO "$OUT"
              fi
              rm -rf "$STAGE"
              ;;
            linux)   ( cd build/linux/x64/release/bundle && tar czf "$DEST/talon-companion-linux.tar.gz" . ) ;;
            android) cp build/app/outputs/flutter-apk/app-release.apk "$DEST/talon-companion-android.apk" ;;
          esac
          ls -la "$DEST"

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talon-companion-${{ matrix.platform }}
          path: apps/companion/dist/*

      # A debug Linux bundle alongside the release one, for chasing issues
      # (asserts on, full stack traces). Workflow artifacts only, never
      # attached to a release.
      - name: Build Linux debug bundle
        if: matrix.platform == 'linux' && github.event_name != 'release'
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --debug --dart-define=TALON_COMMIT="${GITHUB_SHA:0:7}"
          tar -C build/linux/x64/debug -czf talon-companion-linux-debug.tar.gz bundle

      - name: Upload Linux debug bundle
        if: matrix.platform == 'linux' && github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talon-companion-linux-debug
          path: apps/companion/talon-companion-linux-debug.tar.gz

      - name: Attach to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
