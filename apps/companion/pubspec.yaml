name: talon_companion
description: >
  Talon Companion — a beautiful cross-platform client for the Talon agent.
  One Flutter codebase for Windows, macOS, Linux, and Android. On desktop it
  launches/attaches a local Talon daemon; on mobile it connects to a remote
  bridge over the network.
publish_to: "none"
version: 5.31.1 # x-release-please-version

environment:
  # Uses the Color.withValues / WidgetStateProperty APIs (Flutter 3.27+).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # REST + Server-Sent Events transport to the Talon bridge.
  http: ^1.2.2
  # SHA-256 for bridge certificate fingerprint pinning.
  crypto: ^3.0.6
  # Persist the connection profile (host/port/token, local vs remote).
  shared_preferences: ^2.3.2
  # App-support directory: for the offline chat snapshot and the mesh
  # liveness file, which each live in their own file rather than inside the
  # SharedPreferences store (#1059/#1060/#1063), and so the settings store's
  # directory can be restricted to the current user on Linux (see
  # PrivateStore).
  path_provider: ^2.1.5
  # Markdown rendering for assistant replies (code blocks, tables, lists).
  flutter_markdown: ^0.7.4
  # AST access for the custom fenced-code-block builder (copy button +
  # syntax highlighting). Same package flutter_markdown parses with.
  markdown: ^7.2.2
  # Syntax highlighting inside fenced code blocks.
  flutter_highlight: ^0.7.0
  # The highlighter flutter_highlight wraps. Used directly so highlighting can
  # run in a background isolate and be cached (lib/src/ui/highlight_cache.dart)
  # instead of re-running inside build on every scroll.
  highlight: ^0.7.0
  # Declarative animation layer (gskinner, a Flutter Favorite). Replaces the
  # hand-rolled AnimationControllers with a chainable .animate() API and powers
  # the staggered list entrances, shimmer skeletons, and streaming caret.
  flutter_animate: ^4.5.0
  # Material You: reads the platform's own colour source (Android 12+
  # wallpaper palette, macOS/Windows accent colour) so the app's accent can
  # follow the system instead of only the presets. Falls back to null off
  # those platforms, which is exactly what the "Wallpaper" swatch needs.
  dynamic_color: ^1.7.0
  # Open links from assistant messages / buttons in the OS browser.
  url_launcher: ^6.3.0
  # Pick files to attach to a message. Chosen over image_picker because it
  # supports every target this app ships to (Windows/macOS/Linux + Android),
  # whereas image_picker has no desktop-Linux/Windows implementation — and it
  # picks any file type, not just images. 10.x: on Linux it asks the
  # xdg-desktop-portal FileChooser over D-Bus instead of shelling out to
  # zenity/kdialog — the only way a file dialog works inside Flatpak, and it
  # needs no helper binary on a normal desktop either.
  file_picker: ^10.3.3
  # Drag-and-drop of OS files onto the chat (desktop only — Flutter has no
  # core API for a native file drop). Pure platform channels, so it adds no
  # native toolchain requirement to the Windows/macOS/Linux builds.
  desktop_drop: ^0.8.4
  # Device mesh: one-shot/periodic position fixes, battery/charging state,
  # and network connectivity for the status command.
  geolocator: ^14.0.2
  battery_plus: ^6.2.3
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  uuid: ^4.5.1
  flutter_foreground_task: ^9.2.2
  cupertino_icons: ^1.0.8
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1
  flutter_local_notifications: ^22.2.0
  # Optional app lock (#1051). cryptography: Argon2id for the passcode
  # verifier/KEK and AES-256-GCM for the sealed chat snapshot (pure Dart, run
  # off the UI isolate). flutter_secure_storage: the lock record in the
  # platform keystore/keychain (its own namespace — the bridge credential
  # store from #1068 can share the package). local_auth: Touch ID / Windows
  # Hello / BiometricPrompt availability and prompts. flutter_secure_storage
  # stays on 10.x: 11.x's Windows plugin needs win32 ^6, while
  # device_info_plus 11 (and the other *_plus plugins here) pin win32 ^5.
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2

# file_picker resolves flutter_plugin_android_lifecycle to 2.0.35, whose Android
# library requires compiling against API 36 while file_picker itself compiles
# against 34 — an inconsistency that fails the Android release AAR-metadata
# check. Pin to 2.0.24 (still satisfies file_picker's ^2.0.22), which builds
# against 34, keeping the plugin toolchain internally consistent.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_lints: ^4.0.0
  # Required by test/ (bridge_models_test.dart imports package:flutter_test).
  # Without this declared, `flutter test` refuses to run the suite.
  flutter_test:
    sdk: flutter
  # Generates the platform launcher icons from assets/icon/ (a minimal Talon
  # bird mark). Committed platforms (android, macos) are generated from this
  # block; windows/ is scaffolded fresh in CI, so its icon is regenerated there
  # with icons-windows.yaml (see .github/workflows/companion.yml).
  flutter_launcher_icons: ^0.14.1

# Minimal Talon falcon mark → all launcher icons (no text). Source of truth is
# the SVGs in assets/icon/; scripts/render-icons.py re-renders every committed
# platform PNG from them (no Flutter needed — run it after icon edits), and
# lib/src/ui/brand.dart (BrandMark) draws the same geometry in-app. This block
# stays for parity: `dart run flutter_launcher_icons` produces the same icons
# from the rendered 1024px PNGs. Android uses an adaptive icon: the bird
# foreground on a dark brand background; other platforms use the full mark.
flutter_launcher_icons:
  image_path: "assets/icon/talon_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0C14"
  adaptive_icon_foreground: "assets/icon/talon_icon_foreground.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/talon_icon.png"

flutter:
  uses-material-design: true
  assets:
    # Windows tray icon (tray_manager resolves it from the asset bundle).
    - assets/icon/talon_icon.ico

  # Bundled type: Inter for UI text, JetBrains Mono for code — identical
  # rendering on every platform instead of whatever the OS default is.
  # Both are OFL-licensed (license files ship next to the fonts).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
