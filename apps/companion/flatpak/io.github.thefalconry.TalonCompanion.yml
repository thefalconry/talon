# Flatpak manifest for Talon Companion — the Flutter desktop client for a
# Talon daemon. It repackages the prebuilt Linux bundle attached to each
# GitHub release (CI: .github/workflows/companion.yml, asset
# talon-companion-linux.tar.gz = build/linux/x64/release/bundle); nothing is
# compiled from the app's own source here. See README.md in this directory.
id: io.github.thefalconry.TalonCompanion

# Runtime choice: the Flutter Linux embedder (libflutter_linux_gtk.so) and the
# plugins in the bundle link GTK 3, GDK, Pango, Cairo, HarfBuzz, ATK
# (at-spi2-core), GdkPixbuf, GLib/GIO, libepoxy, fontconfig and zlib — all of
# which org.freedesktop.Platform ships (GTK 3 has been part of the
# freedesktop-sdk runtime since 18.08; still present in 26.08). Nothing in the
# bundle needs a GNOME-only library (libadwaita, GTK 4, libsoup, WebKit…), so
# the smaller freedesktop runtime is enough and org.gnome.Platform would only
# add download size. The bundle's newest glibc symbol is GLIBC_2.34 (it is
# built on ubuntu-latest), well within 26.08.
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: talon-companion

finish-args:
  # Display: native Wayland with an X11 fallback. GTK 3 + GL rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The whole app is a network client: HTTP + SSE to a Talon bridge, on
  # localhost (a daemon on this machine) or over the LAN/internet.
  - --share=network
  # Deliberately absent:
  #   * No --filesystem: attachments and the client-certificate import go
  #     through the xdg-desktop-portal FileChooser (file_picker >= 10 on Linux),
  #     and drag-and-drop through the document portal.
  #   * No --socket=pulseaudio: voice mode is Android-only in this build
  #     (VoiceEngine.supported), so the desktop app never opens an audio device.
  #     Add it back if/when desktop voice ships.
  #   * No --talk-name=org.freedesktop.Notifications: desktop notifications are
  #     Android-only too (MessageNotifications.supported). When Linux
  #     notifications land, prefer the notification portal (needs no
  #     permission) over talking to the notification daemon directly.
  #   * No --talk-name=org.freedesktop.Flatpak and no host access: the Flatpak
  #     build is client-only. The app detects the sandbox (lib/src/services/
  #     sandbox.dart) and turns off the self-updater and mesh device control.
  #   * No StatusNotifierItem/tray talk-names: the tray is Windows-only.

modules:
  # libtray_manager_plugin.so is in the bundle (tray_manager is a dependency
  # of every desktop target) and is a hard NEEDED of the main binary, so its
  # libayatana-appindicator3 stack must be loadable even though the Linux app
  # never shows a tray icon. Built from Flathub's shared-modules (a git
  # submodule in the Flathub repo; clone it next to this manifest for local
  # builds — see README.md).
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: talon-companion
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -d /app/talon-companion
      - cp -a bundle/. /app/talon-companion/
      - install -Dm755 talon-companion.sh /app/bin/talon-companion
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 ${FLATPAK_ID}-128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}-256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
    sources:
      # The release bundle. CI tars it with `tar czf … .` from inside the
      # bundle dir, so there is no top-level folder: strip nothing, extract
      # into bundle/ (-> talon_companion, lib/, data/).
      - type: archive
        url: https://github.com/thefalconry/talon/releases/download/v5.7.0/talon-companion-linux.tar.gz
        sha256: d8ece43dc30fdffdcfbfa562fd0ef3360b7ebc7c6da8c9b491240d7ac9501813
        strip-components: 0
        dest: bundle
        only-arches:
          - x86_64
        # Lets flatpak-external-data-checker (Flathub's bot) open a PR bumping
        # url + sha256 whenever a new GitHub release is published.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/thefalconry/talon/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="talon-companion-linux.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
      - type: script
        dest-filename: talon-companion.sh
        commands:
          # The Flutter embedder finds lib/ and data/ relative to
          # /proc/self/exe, so exec the real binary in place.
          - exec /app/talon-companion/talon_companion "$@"
      - type: file
        path: io.github.thefalconry.TalonCompanion.desktop
      - type: file
        path: io.github.thefalconry.TalonCompanion.metainfo.xml
      - type: file
        path: icons/io.github.thefalconry.TalonCompanion.svg
      - type: file
        path: icons/io.github.thefalconry.TalonCompanion-128.png
      - type: file
        path: icons/io.github.thefalconry.TalonCompanion-256.png
