services:
  talon:
    build:
      context: .
      # RUNTIME=node builds the Node 24 + tsx fallback image instead of
      # the default Bun one. Both use HOME=/data, so the mount below is
      # identical either way.
      args:
        RUNTIME: bun
    restart: unless-stopped
    volumes:
      # ONE data root, and it is HOME inside the container (HOME=/data).
      # Everything that must survive an image update lives in it:
      #   .talon/          config, chat history, memory, workspace, keys
      #   .claude/         Claude sign-in AND every Claude transcript
      #   .claude.json     Claude Code account/onboarding state
      #   .codex/          Codex sign-in and sessions
      #   .gemini/         Antigravity sign-in and conversations
      #   .local/share/    OpenCode / Kilo session databases
      # Create the directory first (owned by the container's UID, 1000 by
      # default) or Docker creates it as root:
      #   mkdir -p ~/talon-data
      #
      # Upgrading from the old layout (separate ~/.talon and ~/.claude
      # mounts at /home/bun)? Copy both into this directory before the
      # first `up` — docs/docker.md, "Upgrading from the old layout".
      # This file no longer mounts /home/bun/..., so an `up` before the
      # copy starts an empty Talon; your old data stays untouched on the
      # host. (A container still started with only the old mounts keeps
      # running on them: the entrypoint detects that layout.)
      #
      # Fresh setup, Claude backend: `docker compose exec talon claude auth
      # login`, paste the OAuth URL into your browser and the code back;
      # the sign-in lands in <data>/.claude. (The image's `claude` is the
      # CLI the Agent SDK ships, linked onto PATH.)
      - ${TALON_DATA_DIR:-${HOME}/talon-data}:/data
    environment:
      - NODE_ENV=production
      # First boot only: with no ~/.talon/config.json yet, the entrypoint
      # writes one from these (docker/seed-config.mjs lists them all) and
      # ignores them afterwards. With none set it starts the native bridge.
      # - TALON_BOT_TOKEN=123456:ABC...
      # - TALON_ADMIN_USER_ID=123456789
      # - TALON_BACKEND=claude
      # - TALON_BRIDGE_URL=https://my-host.lan:19880
    # Publish the native bridge for the companion app / talon-node devices:
    # ports:
    #   - "19880:19880"
    # Optional: ANTHROPIC_API_KEY etc. as a fallback to OAuth-via-credentials.json.
    # Uncomment and create .env if you want to auth via API key instead of Claude Max.
    # env_file: .env
    mem_limit: 1g
    cpus: "1.0"
