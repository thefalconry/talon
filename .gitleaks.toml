# Gitleaks config — extends the default ruleset (this file REPLACES the
# defaults unless [extend] pulls them back in, so keep that block).

[extend]
useDefault = true

[allowlist]
description = """Throwaway TLS test fixtures. The companion's certificate-
pinning tests handshake against a key/cert pair minted by the daemon's own
generator (src/frontend/native/bridge/tls.ts) purely for tests — the key is
trusted by nothing, signs nothing real, and can be regenerated at will.
Real key material never belongs in the repo; the runtime bridge identity
lives in ~/.talon/keys/."""
# Second exception: src/__tests__/secret-scan.test.ts is the test suite for
# Talon's OWN outbound secret-scanning guard. Its table of vendor token
# shapes must hold literal, realistic-looking values or the tests prove
# nothing — they exist to exercise the exact regexes the guard ships. Every
# entry is a vendor-documentation example (AKIAIOSFODNN7EXAMPLE,
# ghp_ABCDEF..., xoxb-1234...) and grants nothing anywhere.
#
# Third exception: protocol/fixtures/auth_v1.json holds sample per-device
# bridge credentials (`tdc1.<id>.<secret>`) so all three implementations can
# assert the wire shapes against the same bytes. The secrets are base64 of
# "Bogus-fixture-secret-not-a-real-…"-style strings, were never minted by a
# daemon, and authenticate nothing.
#
# Note all paths live in ONE [allowlist] table: gitleaks 8.24 ignores the
# [[allowlists]] array form, so a second table would silently disable the
# first exception rather than add to it (verified locally against the full
# --log-opts=--all history).
paths = [
  '''apps/companion/test/fixtures/.*\.pem''',
  '''apps/companion/test/fixtures/.*\.p12''',
  '''src/__tests__/secret-scan\.test\.ts''',
  '''protocol/fixtures/auth_v1\.json''',
]
